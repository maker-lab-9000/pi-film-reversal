[platformio]
default_envs = sticks3

[env:sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
extra_scripts = pre:scripts/generate_config.py
build_flags =
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  M5Unified=https://github.com/m5stack/M5Unified#8530f5377d782e4a25a6c482de2e71c3f75ca8eb
  M5GFX=https://github.com/m5stack/M5GFX#d91077b9a607b59404e4e4a49f775c792bfae382
  M5PM1=https://github.com/m5stack/M5PM1#be9a5456c007c333e7ac963f33bfde1ffa5d82ee
  JPEGDEC=https://github.com/bitbank2/JPEGDEC.git#1.8.2

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
  +<capture_client.cpp>
  +<display_power.cpp>
  +<battery_status.cpp>
  +<status_fields.cpp>
  -<main.cpp>
  -<display.cpp>
