[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-film-reversal"
version = "0.1.0"
description = "Saturated color-negative grading and reference-trained 3D LUTs for USB cameras"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.1",
]

[project.optional-dependencies]
opencv = ["opencv-python>=4.8"]
train = ["scipy>=1.12", "requests>=2.31", "tqdm>=4.66", "opencv-python>=4.8"]
deploy = ["paramiko>=3.4"]
dev = ["opencv-python>=4.8", "pytest>=7.4", "ruff>=0.4", "build>=1.0"]

[project.scripts]
pifilm-fetch = "pifilm.train.fetch:main"
pifilm-train = "pifilm.train.fit:main"
pifilm-capture = "pifilm.capture.app:main"
pifilm-process = "pifilm.capture.batch:main"
pifilm-preset = "pifilm.preset:main"
pifilm-battery = "pifilm.capture.power:main"

[tool.setuptools.packages.find]
include = ["pifilm*"]

[tool.setuptools.package-data]
pifilm = ["data/*.cube", "data/*.json", "data/*.txt", "data/looks/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests import scripts/ and firmware/sticks3/scripts/ as namespace packages
# from the repo root; without this only `python -m pytest` can collect them.
pythonpath = ["."]
addopts = "-ra"
markers = ["slow: builds a wheel and installs it into a temporary venv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
